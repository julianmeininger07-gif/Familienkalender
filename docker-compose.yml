# Nur zum Ausprobieren auf dem eigenen Rechner:   docker compose up -d --build   → http://localhost:3000
# Auf einem Server mit eigener Domain und HTTPS:  docker compose --profile https up -d --build
# Einstellungen kommen aus der Datei .env (Vorlage: .env.example). Anleitung: docs/hosting.md
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kalender
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kalender}
      POSTGRES_DB: kalender
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalender"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kalender:${DB_PASSWORD:-kalender}@db:5432/kalender
      APP_URL: ${APP_URL:-http://localhost:3000}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN in .env setzen}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  db-data:
  caddy-data:
