<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Familienkalender</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff; color: #111827; font: 16px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 22rem; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  button { margin-top: 1rem; background: #111827; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1 style="font-size:1.25rem">Keine Verbindung</h1>
  <p>Der Kalender braucht Internet. Sobald du wieder online bist, geht es weiter.</p>
  <button onclick="location.reload()">Nochmal versuchen</button>
</main>
<script>addEventListener("online", () => location.reload());</script>
</body>
</html>
